<!DOCTYPE html>
<html lang="en">

<head>

<body class="forge-page">

<header class="site-head">
    <div class="wrap">
        <a class="brand" href="../"><svg class="logo" viewBox="35.55 22.88 32.09 27.49" aria-hidden="true">
            <path class="logo-anvil" d="m 67.138019,34.792707 c 0,4.233333 -12.303125,5.38675 -12.303125,8.466666 0,3.079916 3.175,3.96875 3.175,3.96875 h 1.058333 c 0.293158,0 0.529167,0.236009 0.529167,0.529167 v 1.5875 c 0,0.293158 -0.236009,0.529167 -0.529167,0.529167 H 44.25156 c -0.293158,0 -0.529166,-0.236009 -0.529166,-0.529167 v -1.5875 c 0,-0.293158 0.236008,-0.529167 0.529166,-0.529167 h 1.058334 c 0,0 2.910416,-0.888834 2.910416,-3.96875 0,-2.545563 -2.116667,-6.35 -12.170833,-6.35 v -2.116666 z"/>
            <rect class="logo-slide" x="37.636982" y="23.382547" width="17.4625" height="9.8226576" rx="0.79375"/>
            <rect class="logo-title" x="38.959904" y="24.738539" width="7.9375" height="0.79375" rx="0.396875"/>
          </svg>ThemeForge</a>
        <nav aria-label="Main">
            <a  href="https://github.com/rose-ember-forge/ThemeForge"
                target="_blank"
                rel="noopener">GitHub</a>
            <div    class="mode-switch" role="group" aria-label="Colour mode">
                <button type="button" data-mode-btn="light" aria-pressed="false" aria-label="Light" title="Light"></button>
                <button type="button" data-mode-btn="auto" aria-pressed="false" aria-label="Auto: Follow the system theme" title="Auto"></button>
                <button type="button" data-mode-btn="dark" aria-pressed="false" aria-label="Dark" title="Dark"></button>
            </div>
        </nav>
    </div>
</header>

<main class="forge" data-name="Next">
    <div class="crumb"><a href="../">Themes</a> / Theme in the forge</div>

    <div class="stage-wrap">
        <button type="button" class="stage" id="stage" aria-label="Strike the anvil" aria-disabled="true">
        <span class="rig" id="rig">
            <span class="glow" id="glow"></span>
            <svg class="anvil" id="anvil" viewBox="31.5 14 40 38" aria-hidden="true">
                <path d="m 67.138019,34.792707 c 0,4.233333 -12.303125,5.38675 -12.303125,8.466666 0,3.079916 3.175,3.96875 3.175,3.96875 h 1.058333 c 0.293158,0 0.529167,0.236009 0.529167,0.529167 v 1.5875 c 0,0.293158 -0.236009,0.529167 -0.529167,0.529167 H 44.25156 c -0.293158,0 -0.529166,-0.236009 -0.529166,-0.529167 v -1.5875 c 0,-0.293158 0.236008,-0.529167 0.529166,-0.529167 h 1.058334 c 0,0 2.910416,-0.888834 2.910416,-3.96875 0,-2.545563 -2.116667,-6.35 -12.170833,-6.35 v -2.116666 z"/>
                <!-- Restart arrow: drawn onto the anvil's body once the log runs out -->
                <g class="again" id="again">
                    <path class="again-arc" id="again-arc" pathLength="1" d="M 52.45 37.955 A 1.9 1.9 0 1 1 50.55 37.955"/>
                    <path class="again-head" id="again-head" d="M 51.33 37.505 L 50.25 37.435 L 50.85 38.475 Z"/>
                </g>
            </svg>
            <span class="ring" id="ring"></span>
            <span class="slide" id="slide" aria-hidden="true">
                <span class="frame" id="frame">
                    <span class="ft">In the Forge</span>
                    <ul><li><span style="width: 78%"></span></li>
                        <li><span style="width: 58%"></span></li>
                        <li><span style="width: 68%"></span></li></ul>
                    <span class="fl">
                        <span class="bar"><i id="bar"></i></span>
                        <span class="pg">1</span>
                    </span>
                </span>
                <span class="src" id="src"></span>
                <span class="heat" id="heat"></span>
            </span>
            <span class="fx" id="fx" aria-hidden="true"></span>
        </span>
        </button>
    </div>

    <h1 id="title">Still in the forge</h1>
    <p class="lede">A new theme is being hammered into shape. It will show up with the others when it's ready.</p>
    <p class="hint" id="hint" aria-live="polite"></p>
    <ol class="log" id="log" aria-live="polite"></ol>

    <a class="back" href="../">Back to all themes</a>
</main>

<footer class="site-foot">
